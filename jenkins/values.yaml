# Values for the official Jenkins Helm chart (https://charts.jenkins.io).
#   helm upgrade --install jenkins jenkins/jenkins -n jenkins -f jenkins/values.yaml
#
# The admin password is generated by the chart and stored in the "jenkins" secret:
#   kubectl get secret jenkins -n jenkins -o jsonpath='{.data.jenkins-admin-password}' | base64 -d
controller:
  serviceType: ClusterIP
  # Builds run in Kubernetes agent pods only (see the agent block in jenkins/Jenkinsfile).
  # Set here, not in JCasC: the chart's default JCasC config already defines numExecutors.
  numExecutors: 0
  servicePort: 80

  # Plugins required by jenkins/Jenkinsfile (versions resolved at install time)
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials-binding
    - timestamper
    - ws-cleanup
    - slack
    - pipeline-stage-view

  JCasC:
    configScripts:
      settings: |
        jenkins:
          systemMessage: "Jenkins configured automatically by Jenkins Configuration as Code plugin"

persistence:
  enabled: true
  size: 8Gi
