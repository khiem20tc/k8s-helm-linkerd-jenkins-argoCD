# kind cluster for the local lab. Ports are substituted by scripts/cluster.sh.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Only reachable from this machine
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: __HTTP_PORT__
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: __HTTPS_PORT__
        listenAddress: "127.0.0.1"
        protocol: TCP
